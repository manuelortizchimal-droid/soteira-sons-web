name: Visual and functional QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check pages, images, mobile and desktop interactions
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs'), http=require('http'),path=require('path');
          const server=http.createServer((req,res)=>{const name=decodeURIComponent(req.url.split('?')[0]);const file=path.join(process.cwd(),name==='/'?'index.html':name);if(!file.startsWith(process.cwd())||!fs.existsSync(file)){res.writeHead(404);return res.end('not found')}res.setHeader('Content-Type',file.endsWith('.html')?'text/html':'application/octet-stream');res.end(fs.readFileSync(file))});
          server.listen(8765,async()=>{let browser;try{
            browser=await chromium.launch({headless:true});
            const errors=[];
            for(const width of [390,1440]){
              const page=await browser.newPage({viewport:{width,height:850},deviceScaleFactor:1});
              page.on('pageerror',e=>errors.push('JS '+width+': '+e.message));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.locator('[data-service="Tarot"]').click();
              if(await page.locator('#servicio').inputValue()!=='Tarot')errors.push('tarot selection broken '+width);
              await page.locator('[data-service="Canalizaciones"]').click();
              if(await page.locator('#servicio').inputValue()!=='Canalizaciones')errors.push('channeling selection broken '+width);
              await page.locator('#draw').click();
              if(await page.locator('#oracle-memory').inputValue()!==await page.locator('#oracle-message').innerText())errors.push('oracle continuity broken '+width);
              if(await page.locator('form').count()!==1)errors.push('contact form missing '+width);await page.locator('#canal').selectOption('Correo');if(await page.locator('#contact-value').getAttribute('type')!=='email')errors.push('email channel broken '+width);await page.locator('#canal').selectOption('WhatsApp');if(await page.locator('#contact-value').getAttribute('type')!=='tel')errors.push('whatsapp channel broken '+width);
              if(await page.locator('.service').count()!==2)errors.push('incorrect service count '+width);
              const horizontal=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
              if(horizontal)errors.push('horizontal overflow '+width);
              await page.screenshot({path:'qa-'+width+'.png',fullPage:true});
              const imageURLs=await page.evaluate(()=>[...document.querySelectorAll('img')].map(x=>x.currentSrc).concat([...document.querySelectorAll('.visual:before')].map(x=>getComputedStyle(document.querySelector('.visual'),'::before').backgroundImage)));
              fs.writeFileSync('images-'+width+'.json',JSON.stringify(imageURLs,null,2));
              await page.close();
            }
            for(const file of ['privacidad.html']){const page=await browser.newPage();const response=await page.goto('http://127.0.0.1:8765/'+file);if(response.status()!==200)errors.push(file+' unavailable');await page.close()}
            const html=fs.readFileSync('index.html','utf8');const urls=[...new Set([...html.matchAll(/https:\/\/images\.pexels\.com\/photos\/\d+\/[^"')\s]+/g)].map(x=>x[0].replace(/&amp;/g,'&')))];
            for(const url of urls){try{const response=await fetch(url,{method:'GET',signal:AbortSignal.timeout(10000)});if(!response.ok)errors.push('Image '+response.status+' '+url)}catch(e){errors.push('Image request failed '+url+' '+e.message)}}
            if(errors.length){console.error(errors.join('\n'));process.exitCode=1}else console.log('QA PASS: pages, 2 viewports, choices, reveal, overflow, '+urls.length+' images');
          }catch(e){console.error(e);process.exitCode=1}finally{if(browser)await browser.close();server.close()}})
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-screenshots
          path: |
            qa-*.png
            images-*.json
          retention-days: 7
